[workspace]
resolver = "2"
members = [
    "crates/furlpay-core",
    "crates/furlpay-simd",
    "crates/furlpay-ipc",
    "crates/furlpay-web",
    "crates/furlpay-daemon",
    "crates/furlpay-mcp",
    "crates/furlpay-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/FurlPay/furlpay-search"
authors = ["FurlPay Engineering <engineering@furlpay.dev>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
arc-swap = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tantivy = "0.22"
tree-sitter = "0.24"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
